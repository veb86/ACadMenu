name: Build, test and release BobrovMenu

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASE_VERSION: v0.2.${{ github.run_number }}

jobs:
  test:
    name: CUIX, bundle and package checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Icons and BobrovMenu.cuix match their sources
        run: |
          python3 scripts/make_icons.py --check
          python3 scripts/build_cuix.py --check
      - name: Unit tests (CUIX structure, command, menu, ribbon, bundle, archive)
        timeout-minutes: 5
        run: python3 -m unittest discover -s tests -v

  package:
    name: Manual install archive (Windows install.cmd / uninstall.cmd)
    needs: test
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Package the manual install archive
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: python scripts/package.py --version $env:RELEASE_VERSION --commit $env:COMMIT_SHA --output-dir artifacts/release
      - name: Verify install.cmd and uninstall.cmd against a temporary APPDATA
        timeout-minutes: 5
        shell: pwsh
        run: ./experiments/Test-BobrovMenuManualInstall.ps1 -ManualInstallZipPath "artifacts/release/BobrovMenu-manual-install-$env:RELEASE_VERSION.zip"
      - name: Write release notes
        shell: pwsh
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          @"
          BobrovMenu $env:RELEASE_VERSION (commit $env:COMMIT_SHA)

          The Bobrov partial CUIX for AutoCAD 2020+ x64 includes the XDATA palette,
          four smart leader buttons and the DB_EDIT button in its own database panel.
          Install the plugins that provide these commands separately.

          BobrovMenu-manual-install-$env:RELEASE_VERSION.zip - per-user install without administrator rights.
          Extract the archive and run install.cmd, or copy its AppData folder into %USERPROFILE%.
          See INSTALL.md in the archive (in Russian).
          "@ | Set-Content artifacts/release/release-notes.md -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: BobrovMenu-release
          path: artifacts/release/
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: package
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BobrovMenu-release
          path: artifacts/release
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          gh release create "$RELEASE_VERSION" \
            "artifacts/release/BobrovMenu-manual-install-$RELEASE_VERSION.zip" \
            --repo "$REPOSITORY" --target "$COMMIT_SHA" \
            --title "BobrovMenu $RELEASE_VERSION" --notes-file artifacts/release/release-notes.md
